[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentenlesbarkeit"
version = "1.0.0"
description = "Abruf- und Auswertungsskripte der Studie Agentenlesbarkeit im Maschinenbau 2027"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "warcio>=1.7",
  "lxml>=5",
  "playwright>=1.45",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Praeregistrierung = "https://leitstand.one/studie"

[tool.setuptools]
packages = ["agentenlesbarkeit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
